name: Refresh grants

# Dnevni tek je zdaj v Supabase Cron (pg_cron, job "scrape-grants-daily", 05:15 UTC), ker GitHub cron
# zamuja za več ur. Ta tok ostane za ročni zagon (workflow_dispatch) in kot rezerva.
on:
  workflow_dispatch:

jobs:
  refresh-grants:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call scrape-grants edge function
        env:
          SCRAPE_GRANTS_URL: ${{ secrets.SCRAPE_GRANTS_URL || 'https://cseifhrfmemvizwbmyjd.supabase.co/functions/v1/scrape-grants' }}
          SCRAPE_GRANTS_SECRET: ${{ secrets.SCRAPE_GRANTS_SECRET }}
        run: |
          set -euo pipefail

          if [ -n "${SCRAPE_GRANTS_SECRET}" ]; then
            response="$(curl -fsS -X POST "$SCRAPE_GRANTS_URL" \
              -H "x-cron-secret: ${SCRAPE_GRANTS_SECRET}")"
          else
            response="$(curl -fsS -X POST "$SCRAPE_GRANTS_URL")"
          fi

          echo "$response"
          echo "$response" | jq -e '.ok == true'

